# configs/config.yaml — tout se regle ici, jamais dans le code.
# Les cles API sont dans .env (voir .env.example), jamais dans ce fichier.

app:
  name: "Assistant UHA"            # nom provisoire : a changer ici seulement
  logo_path: app/assets/logo_uha.svg  # logo officiel du site www.uha.fr
  default_mode: both               # rag | graphrag | both (cote a cote)
  # Les couleurs sont dans .streamlit/config.toml (mecanisme natif de Streamlit).

pipeline: rag                      # architecture par defaut : rag | graphrag
                                   # surcharge : variable d'environnement RAG_UHA_PIPELINE

paths:
  raw_dir: data/raw                # fichiers scrapes (txt, md, html, pdf)
  documents_csv: data/raw/documents.csv
  chunks_file: data/chunks/chunks.jsonl
  chroma_dir: data/artifacts/chroma
  lightrag_dir: data/artifacts/lightrag
  runs_dir: data/runs
  results_dir: eval/results
  questions_file: eval/questions.jsonl
  demo_cache_file: data/demo_cache.json

# ---- LLM : trois roles, chacun avec son fournisseur et son modele ----------
# Changer de fournisseur = changer base_url + model. Pas de bascule automatique.

llm_indexing:                      # extraction d'entites (LightRAG), gros volume
  provider: openrouter             # openrouter | ollama (journal seulement)
  base_url: https://openrouter.ai/api/v1
  model: openai/gpt-oss-120b       # 120b pour un graphe de meilleure qualite (reconstruction du 24/11)
  api_key_env: OPENROUTER_API_KEY  # nom de la variable dans .env (null pour Ollama)
  temperature: 0.0
  max_tokens: 5000
  max_concurrency: 5               # appels simultanes au LLM (debit, pas qualite)
  extra: { reasoning_effort: low } # modeles a raisonnement : court
  # Variante locale (plan B, sans Internet) :
  # provider: ollama
  # base_url: http://localhost:11434/v1
  # model: qwen3:8b
  # api_key_env: null
  # extra: {}

llm_query:                         # generation des reponses, RAG ET GraphRAG
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  model: openai/gpt-oss-120b
  api_key_env: OPENROUTER_API_KEY
  api_key_env: OPENROUTER_API_KEY
  temperature: 0.0
  max_tokens: 1500
  max_concurrency: 5
  extra: { reasoning_effort: low }

llm_judge:                         # juge RAGAS
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  model: qwen/qwen3.8-27b
  api_key_env: OPENROUTER_API_KEY
  temperature: 0.0
  max_tokens: 1500
  max_concurrency: 10
  extra: { reasoning: { enabled: false } }  # sans reflexion : sortie a 1,50 $/M, et evite les NaN

retry:                             # gestion des 429 / 413 / 5xx, commune aux 3 roles
  max_attempts: 8
  min_wait_s: 5
  max_wait_s: 120

# ---- Embeddings : un seul modele pour tout --------------------------------
embeddings:
  provider: cloudflare             # cloudflare | local (plan B, sentence-transformers)
  model: "@cf/baai/bge-m3"
  account_id_env: CF_ACCOUNT_ID
  api_token_env: CF_API_TOKEN
  batch_size: 50                   # <= 100 textes par requete Cloudflare
  dim: 1024

# ---- Decoupage commun -----------------------------------------------------
chunking:
  chunk_tokens: 1200               # valeur du protocole (cf. extraction PDF corrigee)
  overlap_tokens: 100
  tokenizer: cl100k_base           # tiktoken, juste pour compter

# ---- RAG classique --------------------------------------------------------
rag:
  collection: uha_chunks
  top_k: 6                         # passages envoyes au LLM (parametre du protocole)
  rerank: false
  rerank_model: "@cf/baai/bge-reranker-base"
  rerank_candidates: 50            # candidats vectoriels avant fusion (et reranking s'il est actif)
  rerank_batch: 10                 # 10 par appel : 25 faisait echouer la requete
  hybrid: true                     # fusion vectoriel + BM25 : les termes rares et exacts
                                   # (ex. 'ingenierie mathematique') ne remontent que par BM25
  bm25_candidates: 50
  fusion: interleave               # 1er vectoriel, meilleurs BM25, puis suite du vectoriel | rrf
  bm25_slots: 2                    # teste a 1 : hit@4 0,773 -> 0,727, factuelles 0,90 -> 0,80
  rrf_k: 60                        # utilise seulement si fusion: rrf

# ---- GraphRAG -------------------------------------------------------------
graphrag:
  mode: hybrid                     # local | global | hybrid | mix
  top_k: 20
  max_total_tokens: 10000        # budget du contexte envoye au LLM (OpenRouter, paiement a l'usage)
                                   # a 5000, les tableaux entites+relations saturaient le budget
                                   # et LightRAG ne remontait AUCUN passage (23/25 questions)
  entity_extract_max_gleaning: 0   # 0 = un seul passage d'extraction ; 1 = plus complet (+80 % tokens)
  force_llm_summary_on_merge: 6
  summary_language: English        # langue pivot des descriptions du graphe
  entity_types: [Formation, Diplome, Composante, Service, Personne, Cours, Lieu, Procedure, Date, Organisation]
  enable_llm_cache: true
  kg_chunk_pick_method: WEIGHT     # VECTOR classait les passages par similarite avec la question brute :
                                   # avec « uha » dans la question, le passage du master disparaissait

# ---- Generation (commune aux deux pipelines) ------------------------------
generation:
  answer_in_question_language: true
  cite_sources: true
  refuse_if_no_context: true

# ---- Evaluation -----------------------------------------------------------
eval:
  k: 4                             # Hit@k, MRR au niveau du document
  ragas_metrics: [faithfulness, answer_relevancy, answer_correctness]
  ragas_optional: [context_precision]
  price_per_m_tokens:              # tarifs OpenRouter [entree, sortie] en $ par million de tokens
                                   # (tarifs affiches le 23/11/2026 ; ils varient selon le
                                   #  fournisseur route par OpenRouter. Le cout reellement
                                   #  facture est sur openrouter.ai/activity)
    openai/gpt-oss-20b: [0.017, 0.085]
    openai/gpt-oss-120b: [0.03, 0.15]
    qwen/qwen3.8-27b: [0.035, 1.50]
    