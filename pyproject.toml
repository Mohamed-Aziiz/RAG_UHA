[project]
name = "rag-uha"
version = "0.1.0"
description = "Assistant documentaire UHA : comparaison RAG classique (LlamaIndex) vs GraphRAG (LightRAG)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # RAG classique
    "llama-index-core>=0.14,<0.15",
    "llama-index-vector-stores-chroma>=0.5",
    "llama-index-llms-openai-like>=0.5",
    "chromadb>=1.1,<2",
    # GraphRAG
    "lightrag-hku>=1.5.7,<1.6",
    "networkx>=3",
    "pyvis>=0.3",
    # LLM et embeddings par API
    "openai>=1.50",
    "httpx>=0.27",
    "tenacity>=9",
    "tiktoken>=0.8",
    # Documents
    "pypdf>=5",
    "trafilatura>=2",
    "langdetect>=1.0.9",
    # Evaluation
    "ragas>=0.4,<0.5",
    "langchain-openai>=0.3",
    "pandas>=2",
    # Config, app
    "pydantic>=2",
    "pyyaml>=6",
    "python-dotenv>=1",
    "streamlit>=1.40",
    "nest-asyncio>=1.6",
]

[dependency-groups]
dev = ["jupyterlab", "ipykernel", "nbstripout", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_uha"]
